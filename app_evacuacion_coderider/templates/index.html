{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Evacuación Martínez</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recursos/estilos/estilo.css' %}">
    <style>
        /* Estilos específicos para centrar la tarjeta de bienvenida */
        .landing-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .landing-card {
            background: var(--card-bg);
            padding: 50px 70px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: aparecer 0.8s ease-out;
        }
        .landing-card h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        .landing-card h1 span {
            color: var(--primary);
        }
        .landing-card p {
            color: var(--muted);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .btn-ingresar {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 15px 45px;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-ingresar:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
            color: #fff;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Orbes de luz de fondo -->
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <!-- Contenedor central -->
    <div class="landing-container">
        <div class="landing-card">
            <h1>Evacuación <span>Martínez</span></h1>
            <p>Sistema Inteligente de Monitoreo y Rutas</p>
            
            <!-- Botón que redirige a tu página del mapa -->
            <a href="/evacuacion/" class="btn-ingresar">Ingresar al Sistema</a>
        </div>
    </div>
</body>
</html>
